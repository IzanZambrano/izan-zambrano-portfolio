# Dependabot revisa cada semana si hay versiones nuevas y abre Pull Requests para actualizarlas.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: monthly
    commit-message:
      prefix: docker
