name: Build y despliegue

on:
  push:
    branches: [main]
  # Las Pull Requests (p. ej. las de Dependabot) solo compilan, no despliegan.
  pull_request:
  # Se recompila cada día a las 06:00 (hora de España en invierno) para importar
  # los repositorios nuevos o actualizados de GitHub.
  schedule:
    - cron: '0 5 * * *'
  # Botón "Run workflow" en la pestaña Actions para actualizar al momento.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos y plantillas
        run: npm run check

      - name: Compilar la web
        run: npm run build
        env:
          # Token automático del workflow: evita el límite de peticiones de la API de GitHub.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # El despliegue solo se ejecuta cuando hayas creado la variable DEPLOY_ENABLED=true
    # en Settings → Secrets and variables → Actions → Variables (cuando tengas el VPS listo).
    if: vars.DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Copiar archivos al VPS
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT || 22 }}" \
            dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/portfolio/site/"
